version: '3.8'

# ==============================================================================
# Live VLM WebUI - Custom Local Build (Preserves Your Code)
# ==============================================================================
# This compose file builds from YOUR local source code (with custom MDG/NVIDIA UI features)
# instead of pulling pre-built images from registry.
#
# Usage:
#   Ollama:
#     docker compose -f docker-compose.custom.yml --profile ollama up --build
#     docker exec ollama ollama pull llama-vision:11b
#
#   NVIDIA NIM:
#     export NGC_API_KEY=<your-key>
#     docker compose -f docker-compose.custom.yml --profile nim up --build
#
# Access: https://localhost:8090
# ==============================================================================

services:
  # ============================================================================
  # Ollama Service
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles:
      - ollama
      - ollama-jetson-orin
      - ollama-jetson-thor
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - vlm-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Live VLM WebUI - Built from YOUR Local Source (PC / DGX Spark)
  # ============================================================================
  live-vlm-webui:
    build:
      context: .
      dockerfile: Dockerfile.custom
    container_name: live-vlm-webui
    profiles:
      - ollama
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - LIVE_VLM_DEFAULT_MODEL=llava:7b
      - LIVE_VLM_API_BASE=http://localhost:11434/v1
      - LIVE_VLM_PROCESS_EVERY=30
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      # Optional: Mount source for live code reloading (development only)
      # Uncomment to use:
      # - ./src:/app/src:ro
      - /tmp/live-vlm-certs:/app/certs:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

  # ============================================================================
  # Live VLM WebUI - Jetson Orin
  # ============================================================================
  live-vlm-webui-jetson-orin:
    build:
      context: .
      dockerfile: Dockerfile.custom
    container_name: live-vlm-webui
    profiles:
      - ollama-jetson-orin
    network_mode: host
    privileged: true
    environment:
      - PYTHONUNBUFFERED=1
      - LIVE_VLM_DEFAULT_MODEL=llava:7b
      - LIVE_VLM_API_BASE=http://localhost:11434/v1
      - LIVE_VLM_PROCESS_EVERY=30
    volumes:
      - /run/jtop.sock:/run/jtop.sock:ro
      - /tmp/live-vlm-certs:/app/certs:rw
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    runtime: nvidia

  # ============================================================================
  # Live VLM WebUI - Jetson Thor
  # ============================================================================
  live-vlm-webui-jetson-thor:
    build:
      context: .
      dockerfile: Dockerfile.custom
    container_name: live-vlm-webui
    profiles:
      - ollama-jetson-thor
    network_mode: host
    privileged: true
    environment:
      - PYTHONUNBUFFERED=1
      - LIVE_VLM_DEFAULT_MODEL=llava:7b
      - LIVE_VLM_API_BASE=http://localhost:11434/v1
      - LIVE_VLM_PROCESS_EVERY=30
    volumes:
      - /run/jtop.sock:/run/jtop.sock:ro
      - /tmp/live-vlm-certs:/app/certs:rw
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

  # ============================================================================
  # NVIDIA NIM - Vision Language Models (Optional)
  # ============================================================================
  nim:
    image: ${NIM_IMAGE:-nvcr.io/nim/nvidia/cosmos-reason1-7b:1.4.1}
    container_name: nim-cosmos-reason1-7b
    profiles:
      - nim
      - nim-jetson-orin
      - nim-jetson-thor
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.cache/nim:/opt/nim/.cache
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    shm_size: 32gb
    restart: unless-stopped
    networks:
      - vlm-network
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ============================================================================
  # Live VLM WebUI with NIM (PC / DGX Spark)
  # ============================================================================
  live-vlm-webui-nim:
    build:
      context: .
      dockerfile: Dockerfile.custom
    container_name: live-vlm-webui
    profiles:
      - nim
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - LIVE_VLM_DEFAULT_MODEL=nvidia/cosmos-reason1-7b
      - LIVE_VLM_API_BASE=http://localhost:8000/v1
      - LIVE_VLM_PROCESS_EVERY=30
    volumes:
      - /tmp/live-vlm-certs:/app/certs:rw
    restart: unless-stopped
    depends_on:
      nim:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

  # ============================================================================
  # Live VLM WebUI with NIM - Jetson Orin
  # ============================================================================
  live-vlm-webui-nim-jetson-orin:
    build:
      context: .
      dockerfile: Dockerfile.custom
    container_name: live-vlm-webui
    profiles:
      - nim-jetson-orin
    network_mode: host
    privileged: true
    environment:
      - PYTHONUNBUFFERED=1
      - LIVE_VLM_DEFAULT_MODEL=nvidia/cosmos-reason1-7b
      - LIVE_VLM_API_BASE=http://localhost:8000/v1
      - LIVE_VLM_PROCESS_EVERY=30
    volumes:
      - /run/jtop.sock:/run/jtop.sock:ro
      - /tmp/live-vlm-certs:/app/certs:rw
    restart: unless-stopped
    depends_on:
      nim:
        condition: service_healthy
    runtime: nvidia

  # ============================================================================
  # Live VLM WebUI with NIM - Jetson Thor
  # ============================================================================
  live-vlm-webui-nim-jetson-thor:
    build:
      context: .
      dockerfile: Dockerfile.custom
    container_name: live-vlm-webui
    profiles:
      - nim-jetson-thor
    network_mode: host
    privileged: true
    environment:
      - PYTHONUNBUFFERED=1
      - LIVE_VLM_DEFAULT_MODEL=nvidia/cosmos-reason1-7b
      - LIVE_VLM_API_BASE=http://localhost:8000/v1
      - LIVE_VLM_PROCESS_EVERY=30
    volumes:
      - /run/jtop.sock:/run/jtop.sock:ro
      - /tmp/live-vlm-certs:/app/certs:rw
    restart: unless-stopped
    depends_on:
      nim:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

volumes:
  ollama-data:
    driver: local

networks:
  vlm-network:
    driver: bridge

# ==============================================================================
# Quick Start
# ==============================================================================
# 1. Build and start with Ollama:
#    docker compose -f docker-compose.custom.yml --profile ollama up --build
#    docker exec ollama ollama pull llama3.2-vision:11b
#
# 2. Access:  https://localhost:8090
#
# 3. Rebuild after code changes:
#    docker compose -f docker-compose.custom.yml --profile ollama up --build
#
# 4. Stop:
#    docker compose -f docker-compose.custom.yml down
#
# 5. View logs:
#    docker compose -f docker-compose.custom.yml logs -f live-vlm-webui
#
# ==============================================================================
